<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>{{TITLE}}</title>
	<style>
		:root {
			--error-log-border-color: rgba(192, 192, 192, 0.45);
		}
		body {
			font-family: var(--vscode-font-family, sans-serif);
			margin: 0;
			padding: 16px;
			background: var(--vscode-editor-background, #1e1e1e);
			color: var(--vscode-foreground, #ccc);
		}
		h1 {
			margin-top: 0;
			font-size: 18px;
		}
		table {
			width: 100%;
			border-collapse: collapse;
		}
		th,
		td {
			border-bottom: 1px solid var(--error-log-border-color);
			border-bottom-color: color-mix(in srgb, var(--vscode-editorGroup-border, rgba(192, 192, 192, 0.15)) 35%, #ffffff 35%);
			padding: 8px;
			vertical-align: top;
		}
		th {
			text-align: left;
			font-weight: 600;
		}
		th.sortable {
			cursor: pointer;
			user-select: none;
		}
		th.sortable:hover {
			color: var(--vscode-textLink-foreground, #3794ff);
		}
		th.sortable .sort-indicator {
			margin-left: 4px;
			font-size: 12px;
			opacity: 0.6;
		}
		th.sortable.active {
			color: var(--vscode-textLink-activeForeground, var(--vscode-textLink-foreground, #3794ff));
		}
		th.sortable.active .sort-indicator {
			opacity: 1;
		}
		.error-message {
			white-space: pre-wrap;
		}
		th.count-column,
		th.resolve-column,
		td.count-cell,
		td.resolve-cell {
			text-align: center;
		}
		td.time-cell {
			white-space: nowrap;
			font-size: 12px;
			opacity: 0.85;
		}
		.badge {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			background: var(--vscode-badge-background, #007acc);
			color: var(--vscode-badge-foreground, #fff);
			border-radius: 999px;
			padding: 0 8px;
		}
		button.link {
			background: none;
			border: none;
			color: var(--vscode-textLink-foreground, #3794ff);
			cursor: pointer;
			padding: 0;
			font: inherit;
			text-decoration: underline;
		}
		button.link:hover {
			text-decoration: none;
		}
		.meta {
			margin-top: 6px;
			font-size: 12px;
			opacity: 0.7;
		}
		.meta.meta-collapsible {
			opacity: 1;
		}
		.meta-collapsible summary {
			cursor: pointer;
			outline: none;
			opacity: 0.7;
		}
		.meta-collapsible summary:hover,
		.meta-collapsible[open] summary {
			opacity: 1;
		}
		.meta-collapsible-content {
			margin-top: 4px;
			padding: 6px;
			background: color-mix(in srgb, var(--vscode-editor-background, #1e1e1e) 80%, #ffffff 20%);
			border-radius: 4px;
			font-size: 12px;
			line-height: 1.4;
			opacity: 0.85;
			white-space: pre-wrap;
			word-break: break-word;
			overflow-wrap: anywhere;
		}
		.resolved-checkbox {
			transform: scale(1.1);
		}
		.empty {
			margin-top: 16px;
			opacity: 0.7;
		}
	</style>
</head>
<body>
	<h1>{{TITLE}}</h1>
	<div id="table-container"></div>

	<script>
		const vscode = acquireVsCodeApi();

		const state = {
			entries: [],
			pending: new Set(),
			date: '',
			sort: { key: 'count', direction: 'desc' }
		};

		function renderTable() {
			const container = document.getElementById('table-container');
			container.innerHTML = '';

			if (!state.entries.length) {
				const empty = document.createElement('div');
				empty.className = 'empty';
				empty.textContent = 'No log entries for this date.';
				container.appendChild(empty);
				return;
			}

			const table = document.createElement('table');
			const thead = document.createElement('thead');
			thead.innerHTML = `
				<tr>
					<th>Message</th>
					<th class="sortable count-column" data-sort-key="count" style="width: 80px;">Count<span class="sort-indicator"></span></th>
					<th style="width: 160px;">First Time</th>
					<th style="width: 160px;">Last Time</th>
					<th class="sortable resolve-column" data-sort-key="resolved" style="width: 120px;">Resolved<span class="sort-indicator"></span></th>
				</tr>
			`;
			table.appendChild(thead);
			bindSortHandlers(thead);
			updateSortIndicators(thead);

			const tbody = document.createElement('tbody');
			const sortedEntries = sortEntries(state.entries);
			for (const entry of sortedEntries) {
				const tr = document.createElement('tr');
				tr.dataset.entryId = String(entry.id);

				const messageCell = document.createElement('td');
				messageCell.className = 'error-message';
				if (entry.message) {
					injectLinks(messageCell, entry.message);
				} else {
					messageCell.textContent = '(no trace)';
				}
				if (entry.uids) {
					const uidElement = createUidElement(entry.uids);
					if (uidElement) {
						messageCell.appendChild(uidElement);
					}
				}
				tr.appendChild(messageCell);

				const countCell = document.createElement('td');
				countCell.className = 'count-cell';
				countCell.innerHTML = `<span class="badge">${entry.count}</span>`;
				tr.appendChild(countCell);

				const firstCell = document.createElement('td');
				firstCell.className = 'time-cell';
				firstCell.textContent = formatTimestamp(entry.firstTime);
				tr.appendChild(firstCell);

				const lastCell = document.createElement('td');
				lastCell.className = 'time-cell';
				lastCell.textContent = formatTimestamp(entry.lastTime);
				tr.appendChild(lastCell);

				const resolvedCell = document.createElement('td');
				resolvedCell.className = 'resolve-cell';
				const checkbox = document.createElement('input');
				checkbox.type = 'checkbox';
				checkbox.className = 'resolved-checkbox';
				checkbox.checked = !!entry.resolved;
				checkbox.disabled = !!entry.resolved || state.pending.has(entry.id);
				checkbox.addEventListener('change', () => {
					if (!checkbox.checked) {
						checkbox.checked = false;
						return;
					}
					checkbox.disabled = true;
					state.pending.add(entry.id);
					vscode.postMessage({
						type: 'toggleResolved',
						id: entry.id,
						resolved: true
					});
				});
				resolvedCell.appendChild(checkbox);
				tr.appendChild(resolvedCell);

				tbody.appendChild(tr);
			}

			table.appendChild(tbody);
			container.appendChild(table);
		}

		window.addEventListener('message', event => {
			const message = event.data;
			if (!message) {
				return;
			}

			switch (message.type) {
				case 'logData':
					state.entries = message.payload.entries || [];
					state.pending.clear();
					state.date = message.payload.date || '';
					renderTable();
					break;
				case 'resolveStatusUpdate':
					handleResolveStatus(message);
					break;
				default:
			}
		});

		function bindSortHandlers(thead) {
			thead.querySelectorAll('th.sortable').forEach(th => {
				th.addEventListener('click', () => {
					const key = th.dataset.sortKey;
					if (!key) {
						return;
					}
					if (state.sort.key === key) {
						state.sort.direction = state.sort.direction === 'asc' ? 'desc' : 'asc';
					} else {
						state.sort.key = key;
						state.sort.direction = key === 'count' ? 'desc' : 'asc';
					}
					renderTable();
				});
			});
		}

		function updateSortIndicators(thead) {
			thead.querySelectorAll('th.sortable').forEach(th => {
				const key = th.dataset.sortKey;
				const indicator = th.querySelector('.sort-indicator');
				if (!key || !indicator) {
					return;
				}
				if (state.sort.key === key) {
					th.classList.add('active');
					indicator.textContent = state.sort.direction === 'asc' ? '↑' : '↓';
				} else {
					th.classList.remove('active');
					indicator.textContent = '';
				}
			});
		}

		function sortEntries(entries) {
			const sorted = [...entries];
			const { key, direction } = state.sort;
			const factor = direction === 'asc' ? 1 : -1;
			sorted.sort((a, b) => {
				if (key === 'count') {
					const diff = (a.count - b.count) * factor;
					if (diff !== 0) {
						return diff;
					}
					return (b.lastTime - a.lastTime) || (b.count - a.count);
				}
				if (key === 'resolved') {
					const resolvedDiff = (Number(a.resolved) - Number(b.resolved)) * factor;
					if (resolvedDiff !== 0) {
						return resolvedDiff;
					}
					return (b.lastTime - a.lastTime) || (b.count - a.count);
				}
				return (b.lastTime - a.lastTime) || (b.count - a.count);
			});
			return sorted;
		}

		function handleResolveStatus(message) {
			const { id, resolved, success } = message;
			if (typeof id !== 'number') {
				return;
			}
			state.pending.delete(id);
			const entry = state.entries.find(item => item.id === id);
			if (entry) {
				entry.resolved = success ? !!resolved : false;
			}
			renderTable();
		}

		function formatTimestamp(epochSeconds) {
			const numeric = Number(epochSeconds);
			if (!numeric || !Number.isFinite(numeric)) {
				return '-';
			}
			const date = new Date(numeric * 1000);
			if (Number.isNaN(date.getTime())) {
				return '-';
			}
			return date.toLocaleString();
		}

		function injectLinks(container, message) {
			if (!message) {
				container.textContent = '';
				return;
			}
			const pattern = /(script[^\s:]*\.ts(?::\d+)?)/gi;
			let lastIndex = 0;
			let match;
			while ((match = pattern.exec(message)) !== null) {
				const [fullMatch] = match;
				if (match.index > lastIndex) {
					const plainText = message.slice(lastIndex, match.index);
					if (plainText) {
						container.appendChild(document.createTextNode(plainText));
					}
				}
				const button = document.createElement('button');
				button.className = 'link';
				button.type = 'button';
				button.textContent = fullMatch;
				button.addEventListener('click', () => {
					vscode.postMessage({
						type: 'openReference',
						reference: fullMatch
					});
				});
				container.appendChild(button);
				lastIndex = match.index + fullMatch.length;
			}
			if (lastIndex < message.length) {
				container.appendChild(document.createTextNode(message.slice(lastIndex)));
			}
		}

		function createUidElement(uids) {
			if (!uids) {
				return undefined;
			}
			const raw = String(uids).trim();
			if (!raw) {
				return undefined;
			}
			const values = raw.split(/[,，]/).map(item => item.trim()).filter(Boolean);
			const needsCollapse = raw.length > 64 || values.length > 3;
			if (!needsCollapse) {
				const div = document.createElement('div');
				div.className = 'meta';
				div.textContent = `UIDs: ${raw}`;
				return div;
			}
			const details = document.createElement('details');
			details.className = 'meta meta-collapsible';
			const summary = document.createElement('summary');
			summary.textContent = values.length ? `UIDs (${values.length})` : 'UIDs';
			details.appendChild(summary);
			const content = document.createElement('div');
			content.className = 'meta-collapsible-content';
			content.textContent = raw;
			details.appendChild(content);
			return details;
		}
	</script>
</body>
</html>
