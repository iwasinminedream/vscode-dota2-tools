<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="KvFileList.css" />
	<script defer src="KvFileList.js"></script>
</head>

<body>
	<header class="kv-header">
		<div>
			<h2 id="kv-folder-name"></h2>
			<p id="kv-folder-path" class="kv-subtitle"></p>
		</div>
		<div class="kv-actions">
			<vscode-button id="kv-refresh" appearance="secondary" title="Refresh">
				<span class="codicon codicon-refresh"></span>
				<span>Refresh</span>
			</vscode-button>
		</div>
	</header>
	<section id="kv-empty" class="kv-empty" hidden>
		<span>No KV files found in this folder.</span>
	</section>
	<section id="kv-table-wrapper" class="kv-table"></section>
</body>

</html>
