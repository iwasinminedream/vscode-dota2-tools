<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<script src="dota2Icon.js"></script>
	<link href="dota2Icon.css" rel="stylesheet" />
	<title>Dota2 Icons</title>
</head>

<body>
	<div class="search">
		<div class="search-content">
			<div class="dropdown">
				<img id="hero-filter" src="../../images/heroes_icon/npc_dota_hero_base_png.png">
				<div class="dropdown-content">
					<div id="DOTA_ATTRIBUTE_STRENGTH" class="dropdown-content-attribute">
						<div>__replace__</div>
					</div>
					<HR color=#454545>
					<div id="DOTA_ATTRIBUTE_AGILITY" class="dropdown-content-attribute">
						<div>__replace__</div>
					</div>
					<HR color=#454545>
					<div id="DOTA_ATTRIBUTE_INTELLECT" class="dropdown-content-attribute">
						<div>__replace__</div>
					</div>
					<HR color=#454545>
					<div id="DOTA_ATTRIBUTE_ALL" class="dropdown-content-attribute">
						<div>__replace__</div>
					</div>
				</div>
				<div class="dropdown-blur">
				</div>
			</div>
			<input id="filter" type="text" placeholder="Search, supports basic items only" data-i18n-placeholder="searchPlaceholder" oninput="onInput()">
		</div>
		<!-- <i class="fa fa-cog" style="font-size:36px"></i> -->
	</div>
	<div id="texture-content">
		<!-- Content used for code replacement -->
		<div>__replace__</div>
	</div>
	<div id="item-texture-content">
		<!-- Content used for code replacement -->
		<div>__replace__</div>
	</div>
	<script>
	// i18n: the HTML defaults to Chinese, overridden only when the language is English
	(function() {
		const lang = document.documentElement.lang;
		if (lang !== 'en') return;
		const en = {
			abilities: 'Abilities',
			items: 'Items',
			searchPlaceholder: 'Search, supports basic items only'
		};
		document.querySelectorAll('[data-i18n-value]').forEach(el => {
			const key = el.getAttribute('data-i18n-value');
			if (en[key]) el.value = en[key];
		});
		document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
			const key = el.getAttribute('data-i18n-placeholder');
			if (en[key]) el.placeholder = en[key];
		});
	})();
	</script>
</body>

</html>
