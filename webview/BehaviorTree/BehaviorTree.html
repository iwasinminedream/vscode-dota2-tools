<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行为树编辑器</title>
    <link rel="stylesheet" href="{{CODICON_CSS_URI}}">
    <link rel="stylesheet" href="BehaviorTree.css">
    <link rel="stylesheet" href="BehaviorTree-template.css">
    <script>
        console.log('BehaviorTree HTML loaded');
        window.addEventListener('error', function(e) {
            console.error('Window error:', e.error, e.message, e.filename, e.lineno);
        });
    </script>
</head>
<body>
    <div id="app">
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="saveBtn" class="btn btn-primary" title="保存 (Ctrl+S)">
                    <i class="codicon codicon-save"></i> 保存
                </button>
                <button id="addNodeBtn" class="btn" title="添加节点">
                    <i class="codicon codicon-add"></i> 添加节点
                </button>
                <button id="addFromTemplateBtn" class="btn" title="从模板添加节点">
                    <i class="codicon codicon-file-code"></i> 模板
                </button>
                <button id="deleteNodeBtn" class="btn btn-danger" title="删除选中节点 (Delete)">
                    <i class="codicon codicon-trash"></i> 删除
                </button>
            </div>
            <div class="toolbar-group">
                <button id="zoomInBtn" class="btn" title="放大">
                    <i class="codicon codicon-zoom-in"></i>
                </button>
                <button id="zoomOutBtn" class="btn" title="缩小">
                    <i class="codicon codicon-zoom-out"></i>
                </button>
                <button id="fitBtn" class="btn" title="适应画布">
                    <i class="codicon codicon-screen-normal"></i> 适应
                </button>
            </div>
            <div class="toolbar-group">
                <label class="tree-name-label">
                    树名称: 
                    <input type="text" id="treeNameInput" class="tree-name-input" placeholder="行为树名称">
                </label>
            </div>
            <div class="toolbar-group" style="margin-left: auto;">
                <button id="openTextBtn" class="btn" title="用文本编辑器打开（拆分右侧）">
                    <i class="codicon codicon-go-to-file"></i> 文本模式
                </button>
            </div>
        </div>

        <div class="main-container">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>

            <div class="properties-panel" id="propertiesPanel">
                <div class="panel-header">
                    <h3>属性面板</h3>
                    <button id="closePanelBtn" class="close-btn">×</button>
                </div>
                <div class="panel-content" id="propertiesContent">
                    <p class="empty-state">请选择一个节点</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加节点对话框 -->
    <div id="addNodeDialog" class="dialog" style="display: none;">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3>添加节点</h3>
                <button class="close-btn" onclick="closeAddNodeDialog()">×</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>节点类型:</label>
                    <select id="nodeTypeSelect">
                        <option value="Sequence">Sequence (序列)</option>
                        <option value="Selector">Selector (选择器)</option>
                        <option value="Parallel">Parallel (并行)</option>
                        <option value="Condition">Condition (条件)</option>
                        <option value="Action">Action (动作)</option>
                        <option value="Decorator">Decorator (装饰器)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>英文标识符 (Key):</label>
                    <input type="text" id="nodeKeyInput" placeholder="例如: Heal, Attack, CheckHealth">
                </div>
                <div class="form-group">
                    <label>中文名称 (Name):</label>
                    <input type="text" id="nodeNameInput" placeholder="例如: 治疗, 攻击, 检查生命值">
                </div>
                <div class="form-group">
                    <label>描述 (可选):</label>
                    <textarea id="nodeDescInput" placeholder="请输入节点描述" rows="3"></textarea>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeAddNodeDialog()">取消</button>
                <button class="btn btn-primary" onclick="confirmAddNode()">添加</button>
            </div>
        </div>
    </div>

    <!-- 模板选择对话框 -->
    <div id="templateDialog" class="dialog" style="display: none;">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3>选择模板</h3>
                <button class="close-btn" onclick="closeTemplateDialog()">×</button>
            </div>
            <div class="dialog-body">
                <!-- 搜索和筛选栏 -->
                <div class="template-filter-bar">
                    <div class="template-search-box">
                        <span class="codicon codicon-search"></span>
                        <input type="text" id="templateSearchInput" placeholder="搜索模板（名称、描述、类型、键名）" oninput="editor.filterTemplates()">
                        <button class="clear-search-btn" onclick="editor.clearTemplateSearch()" title="清除搜索">
                            <span class="codicon codicon-close"></span>
                        </button>
                    </div>
                    <div class="template-type-filters">
                        <button class="type-filter-btn active" data-type="all" onclick="editor.toggleTemplateType('all')">
                            <span class="codicon codicon-filter"></span> 全部
                        </button>
                        <button class="type-filter-btn" data-type="Sequence" onclick="editor.toggleTemplateType('Sequence')">
                            <span class="type-badge" style="background-color: #2196F3;"></span> Sequence
                        </button>
                        <button class="type-filter-btn" data-type="Selector" onclick="editor.toggleTemplateType('Selector')">
                            <span class="type-badge" style="background-color: #FF9800;"></span> Selector
                        </button>
                        <button class="type-filter-btn" data-type="Parallel" onclick="editor.toggleTemplateType('Parallel')">
                            <span class="type-badge" style="background-color: #4CAF50;"></span> Parallel
                        </button>
                        <button class="type-filter-btn" data-type="Condition" onclick="editor.toggleTemplateType('Condition')">
                            <span class="type-badge" style="background-color: #00BCD4;"></span> Condition
                        </button>
                        <button class="type-filter-btn" data-type="Action" onclick="editor.toggleTemplateType('Action')">
                            <span class="type-badge" style="background-color: #F44336;"></span> Action
                        </button>
                        <button class="type-filter-btn" data-type="Decorator" onclick="editor.toggleTemplateType('Decorator')">
                            <span class="type-badge" style="background-color: #E91E63;"></span> Decorator
                        </button>
                    </div>
                    <div class="template-sort-bar">
                        <label>排序:</label>
                        <select id="templateSortSelect" onchange="editor.sortTemplates()">
                            <option value="name-asc">名称 A-Z</option>
                            <option value="name-desc">名称 Z-A</option>
                            <option value="type-asc">类型 A-Z</option>
                            <option value="date-desc" selected>最新创建</option>
                            <option value="date-asc">最早创建</option>
                        </select>
                    </div>
                </div>
                <!-- 模板列表 -->
                <div id="templateList" class="template-list">
                    <p class="empty-state">正在加载模板...</p>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeTemplateDialog()">取消</button>
            </div>
        </div>
    </div>

    <!-- 保存模板对话框 -->
    <div id="saveTemplateDialog" class="dialog" style="display: none;">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3>保存为模板</h3>
                <button class="close-btn" onclick="closeSaveTemplateDialog()">×</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>模板名称:</label>
                    <input type="text" id="templateNameInput" placeholder="例如: 治疗技能">
                </div>
                <div class="form-group">
                    <label>模板描述 (可选):</label>
                    <textarea id="templateDescInput" rows="3" placeholder="请输入模板描述"></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="templateIncludeChildren" class="vscode-checkbox" checked>
                        <span class="checkbox-indicator"></span>
                        <span class="checkbox-text">包含子节点</span>
                    </label>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeSaveTemplateDialog()">取消</button>
                <button class="btn btn-primary" onclick="confirmSaveTemplate()">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认删除对话框 -->
    <div id="confirmDialog" class="dialog" style="display: none;">
        <div class="dialog-content" style="min-width: 300px;">
            <div class="dialog-header">
                <h3>确认操作</h3>
                <button class="close-btn" onclick="closeConfirmDialog()">×</button>
            </div>
            <div class="dialog-body">
                <p id="confirmMessage">确定要执行此操作吗？</p>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeConfirmDialog()">取消</button>
                <button class="btn btn-danger" onclick="confirmAction()">确定</button>
            </div>
        </div>
    </div>

    <!-- i18n: 中文是默认语言，英文通过脚本覆盖 -->
    <script>
    (function() {
        const lang = document.documentElement.lang;
        if (lang !== 'en') return;

        // Toolbar
        document.querySelector('#saveBtn').title = 'Save (Ctrl+S)';
        document.querySelector('#saveBtn').lastChild.textContent = ' Save';
        document.querySelector('#addNodeBtn').title = 'Add Node';
        document.querySelector('#addNodeBtn').lastChild.textContent = ' Add Node';
        document.querySelector('#addFromTemplateBtn').title = 'Add Node from Template';
        document.querySelector('#addFromTemplateBtn').lastChild.textContent = ' Template';
        document.querySelector('#deleteNodeBtn').title = 'Delete Selected Node (Delete)';
        document.querySelector('#deleteNodeBtn').lastChild.textContent = ' Delete';
        document.querySelector('#zoomInBtn').title = 'Zoom In';
        document.querySelector('#zoomOutBtn').title = 'Zoom Out';
        document.querySelector('#fitBtn').title = 'Fit Canvas';
        document.querySelector('#fitBtn').lastChild.textContent = ' Fit';
        document.querySelector('.tree-name-label').childNodes[0].textContent = 'Tree Name: ';
        document.querySelector('#treeNameInput').placeholder = 'Behavior tree name';
        document.querySelector('#openTextBtn').title = 'Open in Text Editor (Split Right)';
        document.querySelector('#openTextBtn').lastChild.textContent = ' Text Mode';

        // Properties panel
        document.querySelector('#propertiesPanel .panel-header h3').textContent = 'Properties';
        document.querySelector('#propertiesContent .empty-state').textContent = 'Please select a node';

        // Add node dialog
        document.querySelector('#addNodeDialog .dialog-header h3').textContent = 'Add Node';
        const addLabels = document.querySelectorAll('#addNodeDialog .form-group label');
        addLabels[0].textContent = 'Node Type:';
        addLabels[1].textContent = 'Identifier (Key):';
        addLabels[2].textContent = 'Display Name (Name):';
        addLabels[3].textContent = 'Description (optional):';
        const nodeTypeOpts = document.querySelectorAll('#nodeTypeSelect option');
        nodeTypeOpts[0].textContent = 'Sequence';
        nodeTypeOpts[1].textContent = 'Selector';
        nodeTypeOpts[2].textContent = 'Parallel';
        nodeTypeOpts[3].textContent = 'Condition';
        nodeTypeOpts[4].textContent = 'Action';
        nodeTypeOpts[5].textContent = 'Decorator';
        document.querySelector('#nodeKeyInput').placeholder = 'e.g.: Heal, Attack, CheckHealth';
        document.querySelector('#nodeNameInput').placeholder = 'e.g.: Heal, Attack, Check Health';
        document.querySelector('#nodeDescInput').placeholder = 'Enter node description';
        const addBtns = document.querySelectorAll('#addNodeDialog .dialog-footer .btn');
        addBtns[0].textContent = 'Cancel';
        addBtns[1].textContent = 'Add';

        // Template dialog
        document.querySelector('#templateDialog .dialog-header h3').textContent = 'Select Template';
        document.querySelector('#templateSearchInput').placeholder = 'Search templates (name, description, type, key)';
        document.querySelector('.clear-search-btn').title = 'Clear Search';
        document.querySelector('.type-filter-btn[data-type="all"]').innerHTML = '<span class="codicon codicon-filter"></span> All';
        const sortLabel = document.querySelector('.template-sort-bar label');
        sortLabel.textContent = 'Sort:';
        const sortOpts = document.querySelectorAll('#templateSortSelect option');
        sortOpts[0].textContent = 'Name A-Z';
        sortOpts[1].textContent = 'Name Z-A';
        sortOpts[2].textContent = 'Type A-Z';
        sortOpts[3].textContent = 'Newest';
        sortOpts[4].textContent = 'Oldest';
        document.querySelector('#templateList .empty-state').textContent = 'Loading templates...';
        document.querySelector('#templateDialog .dialog-footer .btn').textContent = 'Cancel';

        // Save template dialog
        document.querySelector('#saveTemplateDialog .dialog-header h3').textContent = 'Save as Template';
        const saveLabels = document.querySelectorAll('#saveTemplateDialog .form-group label');
        saveLabels[0].textContent = 'Template Name:';
        saveLabels[1].textContent = 'Template Description (optional):';
        document.querySelector('#templateNameInput').placeholder = 'e.g.: Heal Ability';
        document.querySelector('#templateDescInput').placeholder = 'Enter template description';
        document.querySelector('#saveTemplateDialog .checkbox-text').textContent = 'Include Children';
        const saveBtns = document.querySelectorAll('#saveTemplateDialog .dialog-footer .btn');
        saveBtns[0].textContent = 'Cancel';
        saveBtns[1].textContent = 'Save';

        // Confirm dialog
        document.querySelector('#confirmDialog .dialog-header h3').textContent = 'Confirm';
        document.querySelector('#confirmMessage').textContent = 'Are you sure?';
        const confirmBtns = document.querySelectorAll('#confirmDialog .dialog-footer .btn');
        confirmBtns[0].textContent = 'Cancel';
        confirmBtns[1].textContent = 'OK';
    })();
    </script>
    <script src="BehaviorTree.js"></script>
</body>
</html>
